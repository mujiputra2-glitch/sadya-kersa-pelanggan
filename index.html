<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --ink: #16174F; --body: #2E3048; --muted: #5E6079; --brand: #2728C0; --brand2: #1E1F9C; --orange: #FB4305; --cta: #D93800; --sky: #3152BF;
    --tint: #ECECFB; --line: #DCDDEE; --bg: #F5F5FA; --card: #FFFFFF; --green: #15803D; --red: #DC2626; --grey: #9A9CB0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-size: 17px; line-height: 1.45; color: var(--body); min-height: 100vh; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .hide { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 110px; }
  h1 { font-size: 22px; line-height: 1.2; color: #fff; margin: 0; font-weight: 800; }
  h2 { font-size: 19px; color: var(--ink); margin: 22px 0 10px; font-weight: 800; }
  .muted { color: var(--muted); } .small { font-size: 14px; }

  .top { background: var(--brand); color: #fff; padding: 18px 16px 22px; position: relative; overflow: hidden; }
  .top .in { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .top .sub { color: #D3D4F8; font-size: 14px; }
  .top.homebar { padding-bottom: 46px; background: linear-gradient(135deg, #1B1C93 0%, #2728C0 72%); }
  .top.homebar::before { content: ''; position: absolute; left: 0; top: 0; width: 26%; height: 64%; background: var(--sky); clip-path: polygon(0 0, 100% 0, 0 100%); }
  .top.homebar::after { content: ''; position: absolute; right: 0; bottom: 0; width: 44%; height: 100%; background: var(--orange); clip-path: polygon(100% 22%, 100% 100%, 18% 100%); }
  .brandrow { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mark { flex: none; width: 44px; height: 44px; border-radius: 12px; overflow: hidden; background: var(--brand); box-shadow: 0 0 0 2px rgba(255, 255, 255, .85), 0 4px 12px rgba(0, 0, 0, .22); }
  .mark svg { display: block; width: 100%; height: 100%; }
  .iconbtn { background: transparent; border: 1px solid rgba(255, 255, 255, .32); color: #fff; border-radius: 12px; min-width: 46px; height: 46px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; }
  .back { background: transparent; border: 0; color: #fff; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; padding: 8px 0; min-height: 44px; font-size: 16px; }

  .float { background: var(--card); border-radius: 20px; box-shadow: 0 10px 28px rgba(22, 23, 79, .10), 0 1px 3px rgba(22, 23, 79, .06); padding: 16px; margin-top: 14px; }
  .float.lift { margin-top: -34px; position: relative; z-index: 2; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 12px; }
  .caption { font-size: 13px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--brand2); margin: 22px 2px 8px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stats > * { min-width: 0; text-align: center; border: 0; background: transparent; padding: 0; color: inherit; }
  .stats b { display: block; font-size: 20px; line-height: 1.2; color: var(--ink); font-weight: 800; overflow-wrap: anywhere; }
  .stats span { display: block; font-size: 13px; line-height: 1.3; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
  .stats > * + * { border-left: 1px solid var(--line); }
  .stats .warn b { color: var(--cta); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); padding: 0 16px; font-weight: 700; color: var(--ink); text-decoration: none; }
  .btn.brand { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.cta { background: var(--cta); border-color: var(--cta); color: #fff; }
  .btn.wa { background: #1DA851; border-color: #1DA851; color: #fff; }
  .btn.block { width: 100%; }
  .btn svg { flex: none; width: 22px; height: 22px; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .btnrow > * { flex: 1 1 40%; }

  .item { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 8px; width: 100%; text-align: left; color: inherit; }
  .item .t { flex: 1; min-width: 0; }
  .item .t b { display: block; color: var(--ink); font-size: 17px; line-height: 1.3; }
  .item .t span { display: block; font-size: 14px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
  .item .r { text-align: right; font-size: 13px; color: var(--muted); flex: none; }
  .item .r b { display: block; color: var(--ink); font-size: 15px; }
  .item svg.go { flex: none; width: 20px; height: 20px; color: var(--muted); }
  .tag { display: inline-block; font-style: normal; font-size: 13px; font-weight: 700; line-height: 1.35; border-radius: 999px; padding: 2px 10px; background: var(--tint); color: var(--brand2); }
  .tag.amber { background: #FFE8DD; color: #8F2B00; } .tag.green { background: #DDF3E4; color: #13642F; } .tag.red { background: #FDE7E7; color: #B42318; } .tag.grey { background: #EEEEF5; color: #4E5068; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .note { background: var(--tint); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-top: 12px; color: var(--ink); }
  .note.amber { background: #FFE8DD; color: #8F2B00; }
  .err { color: var(--red); font-weight: 600; margin-top: 12px; font-size: 15px; }
  .chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 15px; min-height: 44px; color: var(--ink); flex: none; }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-top: 12px; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .field { margin-top: 16px; }
  .field > label { display: block; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
  input[type=text], input[type=tel], input[type=email], input[type=password], textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 14px; background: #fff; min-height: 52px; outline: none; }
  input:focus, textarea:focus { border-color: var(--brand); }
  textarea { min-height: 90px; resize: vertical; }
  .pin { letter-spacing: 10px; font-size: 26px; text-align: center; font-weight: 800; }
  .kv { display: grid; grid-template-columns: minmax(0, 1fr) fit-content(62%); gap: 6px 14px; font-size: 16px; margin: 0; }
  .kv dt { color: var(--muted); overflow-wrap: anywhere; } .kv dd { margin: 0; color: var(--ink); font-weight: 600; text-align: right; overflow-wrap: anywhere; }
  .lrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; color: var(--ink); }
  .lrow span { min-width: 0; overflow-wrap: anywhere; } .lrow em { display: block; font-style: normal; font-size: 13px; color: var(--muted); } .lrow b { flex: none; }

  .steps { display: flex; gap: 0; margin: 14px 0 4px; }
  .steps div { flex: 1; text-align: center; font-size: 12px; color: var(--muted); position: relative; padding-top: 22px; }
  .steps div::before { content: ''; position: absolute; top: 4px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--line); z-index: 1; }
  .steps div::after { content: ''; position: absolute; top: 10px; left: -50%; width: 100%; height: 3px; background: var(--line); }
  .steps div:first-child::after { display: none; }
  .steps div.on { color: var(--ink); font-weight: 700; } .steps div.on::before, .steps div.on::after { background: var(--brand); }

  .doc { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 12px; color: var(--ink); }
  .dochead { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 3px solid var(--orange); }
  .dochead .logo { height: 26px; width: auto; }
  .dochead div { text-align: right; } .dochead div b { display: block; font-size: 16px; letter-spacing: 1px; color: var(--brand); } .dochead div span { font-size: 14px; font-weight: 700; }
  .dtab { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 12px; font-size: 14px; }
  .dtab th { text-align: left; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); padding: 6px 4px; }
  .dtab td { border-bottom: 1px solid var(--line); padding: 8px 4px; vertical-align: top; overflow-wrap: anywhere; }
  .dtab td.n, .dtab th.n { text-align: right; width: 22%; overflow-wrap: normal; }
  .dtab td.v, .dtab th.v { width: 38%; }
  @media (max-width: 360px) { .doc { padding: 12px; } .dtab { font-size: 13px; } }
  .dtab th.no { width: 30px; }
  .dtab tfoot td { font-weight: 800; border-bottom: 0; border-top: 2px solid var(--ink); }
  .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; font-size: 13px; color: var(--muted); text-align: center; }
  .sign span { display: block; min-height: 56px; border-bottom: 1px solid var(--ink); margin-bottom: 4px; padding-top: 8px; color: var(--ink); font-weight: 700; }
  .sjphoto { display: block; width: 100%; max-height: 420px; object-fit: contain; border-radius: 12px; margin-top: 12px; background: var(--bg); }

  .nav { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); display: flex; justify-content: center; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); z-index: 20; }
  .nav .in { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; max-width: 560px; gap: 4px; }
  select { width: 100%; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; background: #fff; min-height: 52px; font: inherit; color: var(--ink); }
  input[type=number] { width: 100%; border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 14px; background: #fff; min-height: 52px; }
  .fpick { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .fpick:focus-visible + label { outline: 3px solid var(--brand); outline-offset: 2px; }
  .field > label.btn { display: flex; margin-bottom: 0; color: var(--brand); }
  .docschool { font-size: 20px; font-weight: 800; color: var(--cta); margin: 2px 0 10px; }
  .dtab td.ck, .dtab th.ck { width: 26%; text-align: center; }
  .okv { color: var(--green); } .badx { color: var(--red); }
  .ckrow b { color: var(--ink); }
  .ckrow .btnrow { margin-top: 10px; }
  .btn.okon { background: #DDF3E4; border-color: var(--green); color: #13642F; }
  .btn.badon { background: #FDE7E7; border-color: var(--red); color: #B42318; }
  .ckbad { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 10px; }
  .ckbad .field { margin-top: 10px; }
  .nav button { position: relative; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; font-weight: 700; color: var(--muted); padding: 6px 0; min-height: 58px; border-radius: 12px; }
  .nav button svg { width: 26px; height: 26px; }
  .nav button.on { color: var(--brand); background: var(--tint); }
  .nav button i { position: absolute; top: 4px; left: 54%; min-width: 18px; height: 18px; border-radius: 9px; background: var(--cta); color: #fff; font-style: normal; font-size: 11px; line-height: 18px; padding: 0 5px; }

  .login { max-width: 420px; margin: 0 auto; padding: 40px 20px; }
  .login .logo { display: block; height: 38px; width: auto; margin-bottom: 14px; }
  .login h1 { color: var(--ink); font-size: 24px; }
  .overlay { position: fixed; inset: 0; background: rgba(22, 23, 79, .35); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .overlay .box { background: #fff; border-radius: 16px; padding: 18px 22px; font-weight: 700; color: var(--ink); display: flex; gap: 12px; align-items: center; }
  .spin { width: 22px; height: 22px; border: 3px solid var(--tint); border-top-color: var(--brand); border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600; z-index: 60; width: max-content; max-width: calc(100vw - 32px); text-align: center; }
  .sheet { position: fixed; inset: 0; background: rgba(22, 23, 79, .45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .sheet .panel { background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 18px 16px 28px; }
  .sheet .panel h2 { margin-top: 0; }
  .updbar { position: sticky; top: 0; z-index: 30; background: #FFE8DD; color: #8F2B00; padding: 10px 16px; font-size: 15px; font-weight: 700; }
  #main.anim .rise { animation: rise .45s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 55ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @media (prefers-reduced-motion: reduce) { #main.anim .rise { animation: none; } }
  @media print {
    body * { visibility: hidden !important; }
    .doc, .doc * { visibility: visible !important; }
    .doc { position: absolute; left: 0; top: 0; width: 100%; border: 0; margin: 0; }
  }
</style>
</head>

<div id="vLogin" class="login hide">
  <h1><svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" role="img" aria-label="SNAPP"><path d="M104,12 H31 A19,19 0 0 0 31,50 H73 A19,19 0 0 1 73,88 H0" fill="none" stroke="#2728c0" stroke-width="24" stroke-linejoin="round" stroke-linecap="butt"/><rect x="116" y="0" width="24" height="100" fill="#2728c0"/><rect x="192" y="0" width="24" height="100" fill="#2728c0"/><polygon points="116,0 148.4,0 216,100 183.6,100" fill="#2728c0"/><path d="M240,100 V52 A40,40 0 0 1 320,52 V100" fill="none" stroke="#2728c0" stroke-width="24" stroke-linejoin="round" stroke-linecap="butt"/><path d="M252,64 H308" fill="none" stroke="#fb4305" stroke-width="24" stroke-linejoin="round" stroke-linecap="butt"/><path d="M356,100 V12 H399 A25,25 0 0 1 399,62 H356" fill="none" stroke="#2728c0" stroke-width="24" stroke-linejoin="round" stroke-linecap="butt"/><path d="M460,100 V12 H503 A25,25 0 0 1 503,62 H460" fill="none" stroke="#2728c0" stroke-width="24" stroke-linejoin="round" stroke-linecap="butt"/></svg></h1>

<script>
// Aplikasi Pelanggan (app 1.0.0): the school's own app. Talks only to the API's customer calls
// (PelangganApi.js, app: 'pelanggan'); window.SKP_API is set by the build (sadya-kersa-pelanggan-app).
// checks: the school's per-item check of a delivery note while it is being filled (by SJ number);
// pick / fuNote: files chosen on the File tab and their note.
var SKP = { token: '', data: null, view: 'home', key: '', filter: 'all', photos: {}, shown: '', checks: {}, cf: {}, pick: [], fuNote: '' };
var SKP_ICON = {
  out: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>',
  reload: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8"/><path d="M20 3v5h-5"/></svg>',
  left: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  wa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.3z"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',

// ---------- reminders (Firman 10 Nov: pop-up and phone notification, like a bank app) ----------
function remindList(d) {

  if (ship) out.push([ship + ' kiriman perlu dikonfirmasi setelah barang diterima', 'kirim']);
  var cek = (d.invoices || []).filter(function (i) { return i.canVerify && !i.verif; }).length;
  if (cek) out.push([cek + ' invoice perlu dicek', 'inv']);
  (d.invoices || []).filter(function (i) { return i.status !== 'Lunas' && soon(i.due); }).slice(0, 3).forEach(function (i) {
    out.push(['Invoice ' + i.inv + (i.due < today ? ' lewat jatuh tempo ' : ' jatuh tempo ') + tglPanjang(i.due) + ', ' + rp(i.total), 'invd:' + i.inv]);

    var list = remindList(d), today = new Date().toISOString().slice(0, 10);
    remindNotify(list);
    if (!list.length || store('skp_pop') === today || !$('sheet').classList.contains('hide')) return;
    store('skp_pop', today);
    openSheet('<h2>Pengingat hari ini</h2>' + list.map(function (x) {

function checkForm(s) {
  var st = checksOf(s), cf = SKP.cf[s.no] || (SKP.cf[s.no] = { name: (SKP.data.profile || {}).pic || '', note: '' }), no = jsq(s.no);
  return '<div class="caption">Cek barang yang diterima</div><p class="muted small" style="margin:0 2px">Tandai setiap barang. Bila tidak sesuai, isi selisih dan keterangannya.</p>' +
    s.lines.map(function (l, i) {
      var c = st[i];
      return '<div class="card ckrow"><b>' + (i + 1) + '. ' + esc(l.item) + '</b> <span class="muted small">' + esc(qty(l.qty)) + ' ' + esc(l.unit) + '</span>' +
        '<div class="btnrow"><button class="btn' + (c.ok === true ? ' okon' : '') + '" aria-pressed="' + (c.ok === true) + '" onclick="ckSet(\'' + no + '\',' + i + ',true)">' + SKP_ICON.check + 'Sesuai</button>' +
        '<button class="btn' + (c.ok === false ? ' badon' : '') + '" aria-pressed="' + (c.ok === false) + '" onclick="ckSet(\'' + no + '\',' + i + ',false)">Tidak sesuai</button></div>' +
        (c.ok === false ? '<div class="ckbad"><div class="field"><label for="ckd' + i + '">Selisih</label><input id="ckd' + i + '" type="number" inputmode="numeric" min="1" value="' + esc(c.diff) +
          '" oninput="ckVal(\'' + no + '\',' + i + ',\'diff\',this.value)"></div><div class="field"><label for="ckk' + i + '">Keterangan</label><select id="ckk' + i +
          '" onchange="ckVal(\'' + no + '\',' + i + ',\'ket\',this.value)"><option value="">Pilih</option>' + SKP_KET.map(function (k) { return '<option' + (c.ket === k ? ' selected' : '') + '>' + k + '</option>'; }).join('') +
          '</select></div></div>' : '') + '</div>';
    }).join('') +
    '<div class="field"><label for="cfName">Nama penerima</label><input id="cfName" type="text" value="' + esc(cf.name) + '" oninput="SKP.cf[\'' + no + '\'].name=this.value"></div>' +
    '<div class="field"><label for="cfNote">Catatan <span class="muted small">(boleh kosong)</span></label><textarea id="cfNote" placeholder="Contoh: 1 kursi lecet di kaki" oninput="SKP.cf[\'' + no + '\'].note=this.value">' + esc(cf.note) + '</textarea></div>' +
    '<div id="cfErr" class="err hide"></div><button class="btn cta block" style="margin-top:16px;min-height:58px;font-size:18px" onclick="doConfirm(\'' + no + '\')">KIRIM</button>' +
    '<p class="muted small">Hasil cek terkirim ke admin SNAPP.</p>';
}
function ckSet(no, i, ok) { var c = checksOf(sjOf(no))[i]; c.ok = ok; if (ok) { c.diff = ''; c.ket = ''; } render(); if (!ok && $('ckd' + i)) $('ckd' + i).focus(); }
function ckVal(no, i, k, v) { checksOf(sjOf(no))[i][k] = v; }
function doConfirm(no) {
  var s = sjOf(no), st = checksOf(s), cf = SKP.cf[no] || {}, err = $('cfErr');
  var miss = st.map(function (c, i) { return c.ok === null ? i + 1 : 0; }).filter(Boolean);
  var show = function (m) { err.textContent = m; err.classList.remove('hide'); };
  if (miss.length) return show('Tandai dulu barang nomor ' + miss.join(', ') + '.');
  for (var i = 0; i < st.length; i++) if (st[i].ok === false && (!(+st[i].diff >= 1) || !st[i].ket)) return show('Barang nomor ' + (i + 1) + ': isi selisih dan keterangannya.');
  if (!String(cf.name || '').trim()) return show('Tulis nama penerima barang.');
  busy(true, 'Mengirim...');
  call('skpConfirm', SKP.token, no, cf.name, cf.note || '', st.map(function (c) { return { ok: c.ok, diff: +c.diff || 0, ket: c.ket || 'Sesuai' }; })).then(function (r) {
    delete SKP.checks[no]; delete SKP.cf[no];
    toast(r && r.issues ? 'Terima kasih. Hasil cek terkirim, ' + r.issues + ' barang ada selisih.' : 'Terima kasih. Penerimaan barang tercatat.');
    return loadHome(false);
  }).then(function () { busy(false); }).catch(function (e) { busy(false); show(e.message); });
}

// File tab (5 Nov, Firman): orders as Excel, PDF or photos go to SNAPP as files to download.
var SKP_FILE_EXT = /\.(xlsx|xls|csv|pdf|jpe?g|png|webp|heic|heif)$/i;
function kb(n) { return n >= 1048576 ? String(Math.round(n / 104857.6) / 10).replace('.', ',') + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
function vFile(d) {
  setTop('<div><h1>Kirim file</h1><div class="sub">Order dalam Excel, PDF atau foto</div></div>');
  var h = '<div class="card"><p class="small" style="margin:0">Kirim daftar order atau dokumen sekolah ke SNAPP. Paling banyak 3 file sekaligus, masing-masing sampai 10 MB.</p>' +
    '<div class="field"><input id="fuPick" class="fpick" type="file" multiple accept=".xlsx,.xls,.csv,.pdf,.jpg,.jpeg,.png,.webp,.heic,.heif" onchange="filePicked(this)">' +
    '<label for="fuPick" class="btn block" style="cursor:pointer">' + (SKP.pick.length ? 'Ganti file' : 'Pilih file (Excel, PDF, foto)') + '</label></div>' +
    (SKP.pick.length ? '<div class="note">' + SKP.pick.map(function (f) { return esc(f.name) + ' (' + kb(f.size) + ')'; }).join('<br>') + '</div>' : '') +
    '<div class="field"><label for="fuNote">Catatan <span class="muted small">(boleh kosong)</span></label><textarea id="fuNote" placeholder="Contoh: order untuk semester 2" oninput="SKP.fuNote=this.value">' + esc(SKP.fuNote) + '</textarea></div>' +
    '<div id="fuErr" class="err hide"></div><button class="btn cta block" style="margin-top:14px;min-height:56px" onclick="doUpload()">Kirim ke SNAPP</button></div>';
  var l = d.files || [];
  h += '<div class="caption">File terkirim</div>' + (l.length ? l.map(function (f, n) {
    return '<div class="item rise" style="--i:' + Math.min(n, 8) + '"><span class="t"><b>' + esc(f.name) + '</b><span>' + esc(stamp(f.at)) + ' · ' + esc(f.kind) + ' · ' + kb(f.kb * 1024) +
      (f.note ? '<br>' + esc(f.note) : '') + '</span></span><span class="r"><i class="tag ' + (f.status === 'Diproses' ? 'green' : '') + '">' + (f.status === 'Diproses' ? 'Sudah diproses' : 'Diterima') + '</i></span></div>';
  }).join('') : '<div class="card muted">Belum ada file yang dikirim.</div>');
  return h;
}
function filePicked(input) {
  var list = Array.prototype.slice.call(input.files || []), err = '';
  if (list.length > 3) { err = 'Pilih paling banyak 3 file.'; list = list.slice(0, 3); }
  var bad = list.filter(function (f) { return !SKP_FILE_EXT.test(f.name); })[0], big = list.filter(function (f) { return f.size > 10485760; })[0];
  if (bad) err = bad.name + ': hanya file Excel, PDF atau gambar.';
  else if (big) err = big.name + ': lebih dari 10 MB.';
  else if (list.reduce(function (t, f) { return t + f.size; }, 0) > 15728640) err = 'Total file lebih dari 15 MB. Kirim dalam beberapa kali.';
  SKP.pick = err ? [] : list;
  render();
  if (err) { var el = $('fuErr'); el.textContent = err; el.classList.remove('hide'); }
}
function doUpload() {
  var err = $('fuErr');
  if (!SKP.pick.length) { err.textContent = 'Pilih file yang akan dikirim.'; err.classList.remove('hide'); return; }
  busy(true, 'Mengirim file...');
  Promise.all(SKP.pick.map(function (f) {
    return new Promise(function (ok, no) { var r = new FileReader(); r.onload = function () { ok({ name: f.name, data: String(r.result) }); }; r.onerror = function () { no(new Error(f.name + ': file tidak terbaca.')); }; r.readAsDataURL(f); });
  })).then(function (files) { return call('skpUpload', SKP.token, files, SKP.fuNote); }).then(function (r) {
    SKP.pick = []; SKP.fuNote = '';
    toast(r.files.length + ' file terkirim ke SNAPP.');
    return loadHome(false);
  }).then(function () { busy(false); }).catch(function (e) { busy(false); var el = $('fuErr'); if (el) { el.textContent = e.message; el.classList.remove('hide'); } else toast(e.message); });
}

// Invoices: filter chips, then one invoice as a document with its check buttons.
function vInv(d) {
  setTop('<div><h1>Invoice</h1><div class="sub">Dibuat otomatis dari order sekolah Anda</div></div>');
  var l = d.invoices || [], fl = SKP.filter || 'all';
  var pass = function (i) { return fl === 'all' || (fl === 'belum' ? i.status !== 'Lunas' : i.canVerify && !i.verif); };
  var chips = [['all', 'Semua (' + l.length + ')'], ['belum', 'Belum lunas (' + l.filter(function (i) { return i.status !== 'Lunas'; }).length + ')'], ['cek', 'Perlu dicek (' + d.totals.toVerify + ')']];
  var list = l.filter(pass);
  return '<div class="seg">' + chips.map(function (c) { return '<button class="chip' + (fl === c[0] ? ' on' : '') + '" onclick="SKP.filter=\'' + c[0] + '\';render()">' + esc(c[1]) + '</button>'; }).join('') + '</div>' +
    (list.length ? list.map(invRow).join('') : '<div class="card muted">Tidak ada invoice di sini.</div>');
}
function vInvD(d) {
  var i = invOf(SKP.key);
  backTop('inv', 'Invoice', SKP.key, i ? tglPanjang(i.date) : '');
  if (!i) return '<div class="note amber">Invoice tidak ditemukan. Muat ulang data.</div>';
  var h = '<div class="tags" style="margin-top:14px"><i class="tag ' + (SKP_STEP[i.step.code] || '') + '">' + esc(i.step.text) + '</i>' + (i.status === 'Lunas' ? '<i class="tag green">Lunas' + (i.paidDate ? ' ' + esc(tgl(i.paidDate)) : '') + '</i>' : '<i class="tag grey">Belum lunas</i>') + '</div>';
  h += '<div class="doc"><div class="dochead">' + logoHtml() + '<div><b>INVOICE</b><span>' + esc(i.inv) + '</span></div></div>' +
    '<dl class="kv"><dt>Tanggal</dt><dd>' + esc(tglPanjang(i.date)) + '</dd><dt>Kepada</dt><dd>' + esc(SKP.data.me.name) + '</dd>' +
    (i.received ? '<dt>Barang diterima</dt><dd>' + esc(tglPanjang(i.received)) + '</dd>' + (i.status !== 'Lunas' && i.due ? '<dt>Jatuh tempo</dt><dd>' + esc(tglPanjang(i.due)) + ' (30 hari setelah barang diterima)</dd>' : '') : '') + (i.mkt && i.mkt !== '-' ? '<dt>Melalui</dt><dd>' + esc(i.mkt) + '</dd>' : '') + '</dl>' +
    '<table class="dtab"><thead><tr><th>Barang</th><th class="n">Jumlah</th><th class="n v">Nilai (Rp)</th></tr></thead><tbody>' + i.lines.map(function (l) {
      return '<tr><td>' + esc(l[0] || 'Barang') + '</td><td class="n">' + esc(qty(l[1])) + ' ' + esc(l[2]) + '</td><td class="n v">' + esc(num(l[3])) + '</td></tr>';
    }).join('') + '</tbody><tfoot><tr><td colspan="2">Total</td><td class="n v">' + esc(num(i.total)) + '</td></tr></tfoot></table>' +
    (i.fresh ? '<p class="muted small">Order baru disetujui; rincian pajak mengikuti dokumen SIPLah.</p>' : '') + '</div>';
  if (!nativePlugin('App') && typeof window.print === 'function') h += '<button class="btn block" style="margin-top:12px" onclick="window.print()">Cetak invoice</button>';
  if (i.sj.length) h += '<div class="caption">Surat jalan</div>' + i.sj.map(function (no) { var s = sjOf(no) || {}; return '<button class="item" onclick="go(\'sj\',\'' + jsq(no) + '\')"><span class="t"><b>' + esc(no) + '</b><span>' + esc(s.status || '') + '</span></span>' + SKP_ICON.right + '</button>'; }).join('');
  var v = i.verif;
  h += '<div class="caption">Verifikasi sekolah</div><div class="card">';
  if (v && v.status === 'Sesuai') h += '<b style="color:var(--green)">Invoice sesuai.</b><div class="muted small">' + esc(stamp(v.at)) + ' oleh ' + esc(v.by) + '</div>';
  else if (v && v.status === 'Tidak sesuai') h += '<b style="color:var(--red)">Ditandai tidak sesuai.</b><div class="small" style="margin-top:4px">' + esc(v.note) + '</div>' +
    (v.answered ? '<div class="note"><b>Tanggapan SNAPP:</b> ' + esc(v.answer) + '</div>' : '<div class="muted small" style="margin-top:6px">Menunggu tanggapan SNAPP.</div>');
  else if (!i.canVerify) h += '<span class="muted">' + (i.sj.length ? 'Konfirmasi dulu semua barang yang diterima di menu Kiriman, lalu cek invoice ini.' : i.status === 'Lunas' ? 'Invoice ini sudah lunas.' : 'Invoice bisa dicek setelah barang dikirim dan diterima.') + '</span>';
  if (i.canVerify) h += (v ? '<p class="small" style="margin:10px 0 0">Bila sudah sesuai setelah tanggapan, tandai sesuai:</p>' : '<p class="small" style="margin:0">Barang sudah diterima. Apakah barang, jumlah dan nilai di invoice ini sesuai?</p>') +
    '<div class="btnrow"><button class="btn cta" onclick="verifyOk(\'' + jsq(i.inv) + '\')">' + SKP_ICON.check + 'Invoice sesuai</button>' + (v ? '' : '<button class="btn" onclick="verifyBadSheet(\'' + jsq(i.inv) + '\')">Ada yang tidak sesuai</button>') + '</div>';
  return h + '</div>';
}
function verifyOk(inv) {
  if (!confirm('Tandai invoice ' + inv + ' sesuai? Pilihan ini tidak bisa diubah.')) return;
  busy(true, 'Menyimpan...');
  call('skpVerify', SKP.token, inv, true, '').then(function () { toast('Terima kasih. Invoice ditandai sesuai.'); return loadHome(false); })
    .then(function () { busy(false); }).catch(function (e) { busy(false); toast(e.message); });
}
function verifyBadSheet(inv) {
  openSheet('<h2>Ada yang tidak sesuai</h2><p class="muted small" style="margin-top:-4px">' + esc(inv) + '. Tulis bagian yang tidak sesuai; SNAPP akan menanggapi di aplikasi ini.</p>' +
    '<div class="field"><label for="vbNote">Yang tidak sesuai</label><textarea id="vbNote" placeholder="Contoh: jumlah kursi di invoice 40, yang diterima 38"></textarea></div>' +
    '<div id="vbErr" class="err hide"></div><div class="btnrow"><button class="btn" onclick="closeSheet()">Batal</button><button class="btn cta" onclick="doVerifyBad(\'' + jsq(inv) + '\')">Kirim</button></div>');
}
function doVerifyBad(inv) {
  busy(true, 'Mengirim...');
  call('skpVerify', SKP.token, inv, false, $('vbNote').value).then(function () { closeSheet(); toast('Catatan terkirim ke SNAPP.'); return loadHome(false); })
    .then(function () { busy(false); }).catch(function (e) { busy(false); var el = $('vbErr'); el.textContent = e.message; el.classList.remove('hide'); });
}

// The school's own record: PIC, address, its bank account (for cash back), and orders per year.
function vProfil(d) {
  setTop('<div><h1>Data sekolah</h1><div class="sub">' + esc(d.me.name) + '</div></div>');
  var p = d.profile || {}, years = Object.keys(d.totals.years || {}).sort().reverse();
  var h = '<div class="card"><dl class="kv"><dt>PIC</dt><dd>' + esc(p.pic || '-') + (p.role ? '<br><span class="muted small">' + esc(p.role) + '</span>' : '') + '</dd>' +
    '<dt>No HP</dt><dd>' + esc(p.phone || '-') + '</dd><dt>Email</dt><dd>' + esc(p.email || '-') + '</dd><dt>Alamat kirim</dt><dd style="white-space:pre-wrap">' + esc(p.address || '-') + '</dd>' +
    '<dt>Rekening sekolah</dt><dd>' + (p.account ? esc(p.bank) + '<br>' + esc(p.account) + '<br><span class="muted small">a.n. ' + esc(p.holder) + '</span>' : '-') + '</dd></dl>' +
    '<button class="btn brand block" style="margin-top:14px" onclick="profileSheet()">Ubah data sekolah</button></div>';
  if (!p.pic || !p.phone || !p.address) h += '<div class="note amber">Lengkapi PIC, nomor HP dan alamat kirim agar pengiriman lancar.</div>';
  h += '<div class="caption">Transaksi per tahun</div><div class="card">' + (years.length ? years.map(function (y) {
    return '<div class="lrow"><span>' + esc(y) + '</span><b>' + esc(rp(d.totals.years[y])) + '</b></div>';
  }).join('') : '<span class="muted">Belum ada transaksi.</span>') + '</div>';
  h += '<div class="caption">Akun</div><div class="card"><dl class="kv"><dt>Username</dt><dd>' + esc(d.me.user) + '</dd></dl>' +
    '<button class="btn block" style="margin-top:12px" onclick="doLogout()">' + SKP_ICON.out + 'Keluar</button></div>';
  var cfg = window.SKP_API || {};
  h += '<p class="muted small" style="text-align:center;margin-top:18px">SNAPP' + (cfg.version ? ' · versi ' + esc(cfg.version) : '') +
    (/^https:\/\//.test(cfg.privacy || '') ? ' · <a href="' + esc(cfg.privacy) + '" target="_blank" rel="noopener">Kebijakan privasi</a>' : '') + '</p>';
  return h;
}
function profileSheet() {
  var p = SKP.data.profile || {};
  var f = function (id, label, v, type, ph) { return '<div class="field"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(v) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + '></div>'; };
  openSheet('<h2>Ubah data sekolah</h2>' + f('pPic', 'Nama PIC', p.pic) + f('pRole', 'Jabatan PIC', p.role, '', 'Contoh: Bendahara BOS') + f('pPhone', 'No HP PIC', p.phone, 'tel', '0812 3456 7890') +
    f('pEmail', 'Email', p.email, 'email') + '<div class="field"><label for="pAddr">Alamat kirim</label><textarea id="pAddr" placeholder="Alamat lengkap sekolah">' + esc(p.address) + '</textarea></div>' +
    '<h2 style="margin-top:22px">Rekening sekolah</h2><p class="muted small" style="margin-top:-6px">Untuk pembayaran cash back dari SNAPP. Hanya terlihat oleh sekolah Anda dan admin SNAPP.</p>' +
    f('pBank', 'Bank', p.bank, '', 'Contoh: BJB') + f('pAcc', 'No rekening', p.account, 'text') + f('pHolder', 'Atas nama', p.holder) +
    '<div id="pErr" class="err hide"></div><div class="btnrow"><button class="btn" onclick="closeSheet()">Batal</button><button class="btn brand" onclick="saveProfile()">Simpan</button></div>');
}
function saveProfile() {
  var v = function (id) { return $(id).value; };
  var p = { pic: v('pPic'), role: v('pRole'), phone: v('pPhone'), email: v('pEmail'), address: v('pAddr'), bank: v('pBank'), account: v('pAcc'), holder: v('pHolder') };
  busy(true, 'Menyimpan...');
  call('skpProfile', SKP.token, p).then(function (r) { busy(false); SKP.data.profile = r; store('skp_home', JSON.stringify(SKP.data)); closeSheet(); render(); toast('Data sekolah disimpan.'); })
    .catch(function (e) { busy(false); var el = $('pErr'); el.textContent = e.message; el.classList.remove('hide'); });
}

// ---------- start ----------
document.querySelector('.nav').addEventListener('click', function (e) {
  var b = e.target && e.target.closest ? e.target.closest('button[data-nav]') : null;
  if (b) { var v = b.getAttribute('data-nav'); if (v === 'inv') SKP.filter = 'all'; go(v); }
});
$('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeSheet(); });
$('lgBtn').addEventListener('click', doLogin);
$('lgPin').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
(function nativeSetup() {
  var launcher = nativePlugin('AppLauncher'), app = nativePlugin('App');
  if (launcher) document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a || !/^(tel:|https?:)/.test(a.getAttribute('href'))) return;
    e.preventDefault(); launcher.openUrl({ url: a.getAttribute('href') }).catch(function () { toast('Tautan tidak bisa dibuka di HP ini.'); });
  });
  if (app) app.addListener('backButton', function () {
    if (!$('sheet').classList.contains('hide')) { closeSheet(); return; }
    if (SKP.view === 'sj') { go('kirim'); return; }
    if (SKP.view === 'invd') { go('inv'); return; }
    if (SKP.view !== 'home' && SKP.data) { go('home'); return; }
    app.exitApp();
  });
  if (app) app.addListener('resume', function () { if (SKP.token) loadHome(false); });
})();
(function start() {
  SKP.token = store('skp_token') || '';
  if (store('skp_who')) $('lgWho').value = store('skp_who');
  if (!SKP.token) { showLogin(''); return; }
  try { SKP.data = JSON.parse(store('skp_home') || 'null'); } catch (e) { SKP.data = null; }
  if (SKP.data) { $('vApp').classList.remove('hide'); render(); }
  loadHome(!SKP.data);
})();
</script>
