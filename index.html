    return new Promise(function (ok, no) { var r = new FileReader(); r.onload = function () { ok({ name: f.name, data: String(r.result) }); }; r.onerror = function () { no(new Error(f.name + ': file tidak terbaca.')); }; r.readAsDataURL(f); });
  })).then(function (files) { return call('skpUpload', SKP.token, files, SKP.fuNote, SKP.upId); }).then(function (r) {
    opEnd(); SKP.pick = []; SKP.fuNote = ''; SKP.upId = '';
    toast(r.files.length + ' file terkirim ke SNAPP.', true);
    return loadHome(false);
  }).then(function () { busy(false); }).catch(function (e) { opEnd(); busy(false); showErr('fuErr', e.message); });
}

// Invoices: filter chips, then one invoice as a document with its check buttons.
function vInv(d) {
  setTop('<div><h1>Invoice</h1><div class="sub">Dibuat otomatis dari order sekolah Anda</div></div>');
  var l = d.invoices || [], fl = SKP.filter || 'all';
  var pass = function (i) { return fl === 'all' || (fl === 'belum' ? i.status !== 'Lunas' : i.canVerify && !i.verif); };
  var chips = [['all', 'Semua (' + l.length + ')'], ['belum', 'Belum lunas (' + l.filter(function (i) { return i.status !== 'Lunas'; }).length + ')'], ['cek', 'Perlu dicek (' + d.totals.toVerify + ')']];
  var list = l.filter(pass), t = d.totals;
  return '<div class="card isum"><span class="lic red">' + SKP_ICON.wallet + '</span><div class="t"><small>Belum lunas</small><b>' + esc(rp(t.unpaid)) + '</b><span>' + t.unpaidCount + ' invoice' + (t.toVerify ? ', ' + t.toVerify + ' perlu dicek' : '') + '</span></div></div>' +
    '<div class="seg">' + chips.map(function (c) { return '<button class="chip' + (fl === c[0] ? ' on' : '') + '" onclick="SKP.filter=\'' + c[0] + '\';render(true)">' + esc(c[1]) + '</button>'; }).join('') + '</div>' +
    (list.length ? list.map(invRow).join('') : '<div class="card muted">Tidak ada invoice di sini.</div>');
}
function daysTo(a, b) { var p = String(a).split('-'), q = String(b).split('-'); return Math.round((Date.UTC(+q[0], +q[1] - 1, +q[2]) - Date.UTC(+p[0], +p[1] - 1, +p[2])) / 864e5); }
// Invoice (12 Nov 2.0): amount card with the payment line and progress, details, goods, verification.
function vInvD(d) {
  var i = invOf(SKP.key);
  backTop('inv', 'Invoice', SKP.key, i ? tglPanjang(i.date) : '');
  if (!i) return '<div class="note amber">Invoice tidak ditemukan. Muat ulang data.</div>';
  var code = i.status === 'Lunas' ? 'lunas' : i.step.code, at = { invoice: 0, disiapkan: 0, dikirim: 1, diterima: 2, masalah: 2, lunas: 3 }[code];
  var today = d.today || new Date().toISOString().slice(0, 10), pay, left;
  if (i.status === 'Lunas') pay = '<div class="ipay">' + SKP_ICON.okc + '<span>Lunas' + (i.paidDate ? ' ' + esc(tglPanjang(i.paidDate)) : '') + '</span></div>';
  else if (i.due) { left = daysTo(today, i.due); pay = '<div class="ipay' + (left < 0 ? ' late' : '') + '">' + SKP_ICON.clock + '<span>' + (left < 0 ? 'Lewat jatuh tempo ' + (-left) + ' hari' : left === 0 ? 'Jatuh tempo hari ini' : 'Jatuh tempo ' + esc(tgl(i.due)) + ', ' + left + ' hari lagi') + '</span></div>'; }
  else pay = '<div class="ipay">' + SKP_ICON.clock + '<span>Jatuh tempo 30 hari setelah barang diterima</span></div>';
  var h = '<div class="ihero"><div class="ihtop"><span class="eyebrow">INVOICE</span><i class="tag ' + (i.status === 'Lunas' ? 'green' : SKP_STEP[i.step.code] || '') + '">' + esc(i.status === 'Lunas' ? 'Lunas' : i.step.text) + '</i></div>' +
    '<div class="iamt"><small>Total tagihan</small><b>' + esc(rp(i.total)) + '</b></div>' + pay + track(['Terbit', 'Dikirim', 'Diterima', 'Lunas'], at === undefined ? 0 : at) + '</div>';
  h += docBtns('skpInvPdf', i.inv, 'inv');
  h += '<div class="caption">Rincian</div><div class="card"><dl class="kv rows"><dt>No. invoice</dt><dd>' + esc(i.inv) + '</dd><dt>Tanggal</dt><dd>' + esc(tglPanjang(i.date)) + '</dd><dt>Kepada</dt><dd>' + esc(d.me.name) + '</dd>' +
    (i.received ? '<dt>Barang diterima</dt><dd>' + esc(tglPanjang(i.received)) + '</dd>' : '') + (i.status !== 'Lunas' && i.due ? '<dt>Jatuh tempo</dt><dd>' + esc(tglPanjang(i.due)) + '</dd>' : '') +
    (i.mkt && i.mkt !== '-' ? '<dt>Melalui</dt><dd>' + esc(i.mkt) + '</dd>' : '') +
    '<dt>Status bayar</dt><dd>' + (i.status === 'Lunas' ? 'Lunas' + (i.paidDate ? ' ' + esc(tgl(i.paidDate)) : '') : 'Belum lunas') + '</dd></dl>' +
    '<div class="muted small" style="margin-top:8px">Status lunas diperbarui admin SNAPP setelah pembayaran diterima.</div></div>';
  h += '<div class="caption">Barang, ' + i.lines.length + ' jenis</div><div class="card"><table class="ilist" aria-label="Barang di invoice"><tbody>' + i.lines.map(function (l, n) {
    return '<tr><td class="ino"><span>' + (n + 1) + '</span></td><td><b>' + esc(l[0] || 'Barang') + '</b><span class="q">' + esc(qty(l[1])) + ' ' + esc(l[2]) + '</span></td><td class="iv">' + esc(num(l[3])) + '</td></tr>';
  }).join('') + '</tbody><tfoot><tr><td colspan="2">Total</td><td class="iv">' + esc(rp(i.total)) + '</td></tr></tfoot></table>' +
    (i.fresh ? '<p class="muted small" style="margin:10px 0 0">Order baru disetujui; rincian pajak mengikuti dokumen SIPLah.</p>' : '') + '</div>';
  if (i.sj.length) h += '<div class="caption">Surat jalan</div>' + i.sj.map(function (no) {
    var s = sjOf(no) || {};
    return '<button class="item" onclick="go(\'sj\',\'' + jsq(no) + '\')"><span class="lic ' + (SKP_SJ[s.status] || '') + '">' + (s.status === 'Diterima' ? SKP_ICON.okc : SKP_ICON.truck) + '</span><span class="t"><b>' + esc(no) + '</b><span>' + esc(s.status || '') + '</span></span>' + SKP_CHEV + '</button>';
  }).join('');
  var v = i.verif;
  h += '<div class="caption">Verifikasi sekolah</div><div class="card">';
  if (v && v.status === 'Sesuai') h += vstate('green', SKP_ICON.okc, 'Invoice sesuai.', esc(stamp(v.at)) + ' oleh ' + esc(v.by));
  else if (v && v.status === 'Tidak sesuai') h += vstate('red', SKP_ICON.xc, 'Ditandai tidak sesuai.', esc(v.note)) +
    (v.answered ? '<div class="note"><b>Tanggapan SNAPP:</b> ' + esc(v.answer) + '</div>' : '<div class="muted small" style="margin-top:10px">Menunggu tanggapan SNAPP.</div>');
  else if (!i.canVerify) h += vstate('grey', i.status === 'Lunas' ? SKP_ICON.okc : SKP_ICON.clock, i.status === 'Lunas' ? 'Sudah lunas' : 'Belum bisa dicek',
    i.sj.length ? 'Konfirmasi dulu semua barang yang diterima di menu Kiriman, lalu cek invoice ini.' : i.status === 'Lunas' ? 'Invoice ini sudah lunas.' : 'Invoice bisa dicek setelah barang dikirim dan diterima.');
  else h += vstate('', SKP_ICON.clip, 'Cek invoice ini', 'Barang sudah diterima. Apakah barang, jumlah dan nilai di invoice ini sesuai?');
  if (i.canVerify) h += (v ? '<p class="small" style="margin:12px 0 0">Bila sudah sesuai setelah tanggapan, tandai sesuai:</p>' : '') +
    '<div class="btnrow"><button class="btn cta" onclick="verifyOk(\'' + jsq(i.inv) + '\')">' + SKP_ICON.check + 'Invoice sesuai</button>' + (v ? '' : '<button class="btn" onclick="verifyBadSheet(\'' + jsq(i.inv) + '\')">Ada yang tidak sesuai</button>') + '</div>';
  return h + '</div>';
}
function verifyOk(inv) {
  if (SKP.op || !confirm('Tandai invoice ' + inv + ' sesuai? Pilihan ini tidak bisa diubah.')) return;
  if (!opStart('verify')) return;
  busy(true, 'Menyimpan...');
  call('skpVerify', SKP.token, inv, true, '').then(function () { opEnd(); toast('Terima kasih. Invoice ditandai sesuai.', true); return loadHome(false); })
    .then(function () { busy(false); }).catch(function (e) { opEnd(); busy(false); toast(e.message); });
}
function verifyBadSheet(inv) {
  openSheet('<h2>Ada yang tidak sesuai</h2><p class="muted small" style="margin-top:-4px">' + esc(inv) + '. Tulis bagian yang tidak sesuai; SNAPP akan menanggapi di aplikasi ini.</p>' +
    '<div class="field"><label for="vbNote">Yang tidak sesuai</label><textarea id="vbNote" placeholder="Contoh: jumlah kursi di invoice 40, yang diterima 38"></textarea></div>' +
    '<div id="vbErr" class="err hide"></div><div class="btnrow"><button class="btn" onclick="closeSheet()">Batal</button><button class="btn cta" onclick="doVerifyBad(\'' + jsq(inv) + '\')">Kirim</button></div>');
}
function doVerifyBad(inv) {
  var note = $('vbNote') ? $('vbNote').value : '';
  if (!note.trim()) return showErr('vbErr', 'Tulis bagian yang tidak sesuai.');
  if (!opStart('verify')) return;
  busy(true, 'Mengirim...');
  call('skpVerify', SKP.token, inv, false, note).then(function () { opEnd(); closeSheet(); toast('Catatan terkirim ke SNAPP.', true); return loadHome(false); })
    .then(function () { busy(false); }).catch(function (e) { opEnd(); busy(false); showErr('vbErr', e.message); });
}

// The school's own record: PIC, address, its bank account (for cash back), and orders per year.
function vProfil(d) {
  var jj = jenjangOf(d.me.name);
  setTop('<div><h1>Data sekolah</h1><div class="sub">' + esc(d.me.name) + '</div></div>' +
    '<span class="hbschool sm"><img src="' + schoolArt(d.me.name) + '" alt="" width="44" height="44">' + (jj ? '<i>' + jj + '</i>' : '') + '</span>');
  var p = d.profile || {}, years = Object.keys(d.totals.years || {}).sort().reverse();
  var h = '<div class="card"><dl class="kv rows"><dt>PIC</dt><dd>' + esc(p.pic || '-') + (p.role ? '<br><span class="muted small">' + esc(p.role) + '</span>' : '') + '</dd>' +
    '<dt>No HP</dt><dd>' + esc(p.phone || '-') + '</dd><dt>Email</dt><dd>' + esc(p.email || '-') + '</dd><dt>Alamat kirim</dt><dd style="white-space:pre-wrap">' + esc(p.address || '-') + '</dd>' +
    '<dt>Rekening sekolah</dt><dd>' + (p.account ? esc(p.bank) + '<br>' + esc(p.account) + '<br><span class="muted small">a.n. ' + esc(p.holder) + '</span>' : '-') + '</dd></dl>' +
    '<button class="btn brand block" style="margin-top:14px" onclick="profileSheet()">Ubah data sekolah</button></div>';
  if (!p.pic || !p.phone || !p.address) h += '<div class="note amber">Lengkapi PIC, nomor HP dan alamat kirim agar pengiriman lancar.</div>';
  var top = Math.max.apply(null, years.map(function (y) { return +d.totals.years[y] || 0; }).concat([1]));
  h += '<div class="caption">Transaksi per tahun</div><div class="card">' + (years.length ? years.map(function (y) {
    return '<div class="ybar"><span>' + esc(y) + '</span><span class="yt"><i style="--w:' + Math.max(0.02, (+d.totals.years[y] || 0) / top).toFixed(3) + '"></i></span><b>' + esc(rp(d.totals.years[y])) + '</b></div>';
  }).join('') : '<span class="muted">Belum ada transaksi.</span>') + '</div>';
  h += '<div class="caption">Akun</div><div class="card"><dl class="kv"><dt>Username</dt><dd>' + esc(d.me.user) + '</dd></dl>' +
    '<button class="btn block" style="margin-top:12px" onclick="doLogout()">' + SKP_ICON.out + 'Keluar</button></div>';
  var cfg = window.SKP_API || {};
  h += '<p class="muted small" style="text-align:center;margin-top:18px">SNAPP' + (cfg.version ? ' · versi ' + esc(cfg.version) : '') +
    (/^https:\/\//.test(cfg.privacy || '') ? ' · <a href="' + esc(cfg.privacy) + '" target="_blank" rel="noopener">Kebijakan privasi</a>' : '') + '</p>';
  return h;
}
function profileSheet() {
  var p = SKP.data.profile || {};
  var f = function (id, label, v, type, ph) { return '<div class="field"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(v) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + '></div>'; };
  openSheet('<h2>Ubah data sekolah</h2>' + f('pPic', 'Nama PIC', p.pic) + f('pRole', 'Jabatan PIC', p.role, '', 'Contoh: Bendahara BOS') + f('pPhone', 'No HP PIC', p.phone, 'tel', '0812 3456 7890') +
    f('pEmail', 'Email', p.email, 'email') + '<div class="field"><label for="pAddr">Alamat kirim</label><textarea id="pAddr" placeholder="Alamat lengkap sekolah">' + esc(p.address) + '</textarea></div>' +
    '<h2 style="margin-top:22px">Rekening sekolah</h2><p class="muted small" style="margin-top:-6px">Untuk pembayaran cash back dari SNAPP. Hanya terlihat oleh sekolah Anda dan admin SNAPP.</p>' +
    f('pBank', 'Bank', p.bank, '', 'Contoh: BJB') + f('pAcc', 'No rekening', p.account, 'text') + f('pHolder', 'Atas nama', p.holder) +
    '<div id="pErr" class="err hide"></div><div class="btnrow"><button class="btn" onclick="closeSheet()">Batal</button><button class="btn brand" onclick="saveProfile()">Simpan</button></div>');
}
function saveProfile() {
  var v = function (id) { return $(id).value; };
  var p = { pic: v('pPic'), role: v('pRole'), phone: v('pPhone'), email: v('pEmail'), address: v('pAddr'), bank: v('pBank'), account: v('pAcc'), holder: v('pHolder') };
  if (!opStart('profile')) return;
  busy(true, 'Menyimpan...');
  call('skpProfile', SKP.token, p).then(function (r) { opEnd(); busy(false); SKP.data.profile = r; store('skp_home', JSON.stringify(SKP.data)); closeSheet(); render(); toast('Data sekolah disimpan.', true); })
    .catch(function (e) { opEnd(); busy(false); showErr('pErr', e.message); });
}

// ---------- start ----------
document.querySelector('.nav').addEventListener('click', function (e) {
  var b = e.target && e.target.closest ? e.target.closest('button[data-nav]') : null;
  if (b) { var v = b.getAttribute('data-nav'); if (v === 'inv') SKP.filter = 'all'; go(v); }
});
$('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeSheet(); });
(function sheetSwipe() {
  var p = $('sheetPanel'), y0 = 0, t0 = 0, dy = 0, on = false;
  p.addEventListener('touchstart', function (e) { on = p.scrollTop <= 0 && e.touches.length === 1; if (!on) return; y0 = e.touches[0].clientY; t0 = Date.now(); dy = 0; p.style.transition = 'none'; }, { passive: true });
  p.addEventListener('touchmove', function (e) { if (!on) return; dy = Math.max(0, e.touches[0].clientY - y0); p.style.transform = dy ? 'translateY(' + dy + 'px)' : ''; }, { passive: true });
  p.addEventListener('touchend', function () {
    if (!on) return; on = false;
    var v = dy / Math.max(1, Date.now() - t0);
    p.style.transition = '';
    if (dy > 110 || (dy > 30 && v > 0.35)) closeSheet();
    else if (dy) { p.style.transition = 'transform 320ms ' + SKP_EASE; p.style.transform = ''; }
  });
})();
window.addEventListener('resize', function () { if (SKP.data) navInd(navOf(SKP.view)); });
$('lgBtn').addEventListener('click', doLogin);
$('lgSchools').innerHTML = ['sch_1', 'sch_2', 'sch_3', 'sch_4'].map(function (k) { return '<img src="' + SKP_ART[k] + '" alt="" width="62" height="62">'; }).join('');
$('lgPin').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
(function nativeSetup() {
  var launcher = nativePlugin('AppLauncher'), app = nativePlugin('App');
  if (launcher) document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a || !/^(tel:|https?:)/.test(a.getAttribute('href'))) return;
    e.preventDefault(); launcher.openUrl({ url: a.getAttribute('href') }).catch(function () { toast('Tautan tidak bisa dibuka di HP ini.'); });
  });
  if (app) app.addListener('backButton', function () {
    if (SKP.op) return; // a send is running
    if (!$('sheet').classList.contains('hide')) { closeSheet(); return; }
    if (SKP.view === 'sj') { go('kirim'); return; }
    if (SKP.view === 'invd') { go('inv'); return; }
    if (SKP.view !== 'home' && SKP.data) { go('home'); return; }
    app.exitApp();
  });
  // A file pick, share, print or permission dialog also resumes the app: refresh at most once a minute.
  if (app) app.addListener('resume', function () { if (SKP.token && !SKP.op && Date.now() - SKP_LOADED > 60000) loadHome(false); });
})();
(function start() {
  SKP.token = store('skp_token') || '';
  if (store('skp_who')) $('lgWho').value = store('skp_who');
  if (!SKP.token) { showLogin(''); return; }
  try { SKP.data = JSON.parse(store('skp_home') || 'null'); } catch (e) { SKP.data = null; }
  if (SKP.data) { $('vApp').classList.remove('hide'); render(); }
  loadHome(!SKP.data);
})();
</script>
